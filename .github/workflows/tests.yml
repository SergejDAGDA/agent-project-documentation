name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run repository inventory
        run: python skills/project-documentation/scripts/repository_inventory.py --root . --format markdown > /tmp/project-documentation-inventory.md

      - name: Run documentation audit
        run: python skills/project-documentation/scripts/documentation_audit.py --root .
